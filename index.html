<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#21131b" />
    <meta name="description" content="Un lugar pequeñito para mandarnos besos estemos donde estemos." />
    <title>Besitos — un lugar para nosotras</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <header class="topbar">
      <a class="brand" href="./" aria-label="Besitos, inicio">
        <span class="brand-mark" aria-hidden="true">♥</span>
        <span>besitos<span class="brand-period">.</span></span>
      </a>
      <div class="topbar-right">
        <span class="private-badge"><span class="status-dot"></span> solo nosotras</span>
        <button id="logout-button" class="text-button hidden" type="button">Salir</button>
      </div>
    </header>

    <main id="app" class="app-shell" aria-live="polite">
      <section class="loading-state" aria-label="Cargando">
        <span class="loading-heart" aria-hidden="true">♥</span>
        <p>Preparando un besito…</p>
      </section>
    </main>

    <footer class="footer-note">Hecho con cariño, para estar un poquito más cerca.</footer>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
